<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>forms</title></head>
<body>
  <!-- Netlify Forms detection helper. Not linked anywhere; used only so Netlify registers the "contact" form. -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input name="bot-field">
    <input type="text" name="company">
    <input type="text" name="name">
    <input type="tel" name="phone">
    <input type="email" name="email">
    <select name="inquiry-type"><option value="other">other</option></select>
    <textarea name="message"></textarea>
    <input type="checkbox" name="privacy">
  </form>
</body>
</html>
